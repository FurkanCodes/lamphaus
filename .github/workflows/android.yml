name: Android CI

on:
  push:
    # Production APK building, signing, uploading, and promotion run locally
    # on the owner's Mac (plan §2); metadata-branch pushes never build here.
    branches-ignore:
      - release-metadata
      - release-metadata-qa
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check provider neutrality
        run: ./scripts/check-neutrality.sh
      - name: Release feed contracts
        run: python3 scripts/release/test_feed.py
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
